			<div class="hero-img relative hero-block">
					<div class="img-overlay">
						<img src="img/hero.webp" alt="Святослав Задерий и Группа НАТЕ! - основатель группы Алиса, ленинградский рок-музыкант" fetchpriority="high">

							<!-- Logo will be populated here by JavaScript -->

				<article class="text-block text-block-left" id="text-block-left" aria-label="Band history">
					<noscript>
						<p class="text">Советский рок – неотъемлемая часть мировой культуры. В нём были выкрикнуты надежды и чаяния нескольких поколений жителей советского и постсоветского пространства, их мировоззрение, боль и мечты. Среди тех, кто создавал музыку и слова, отразившие эпоху конца Союза, есть немало имён незаслуженно забытых, затерянных во времени, но не потерявших своей значимости.</p>
						<p class="text">Группа НАТЕ! была основана в 1987 году в Ленинграде Святославом Задерием, который также основал группу Алиса. Название группы предложил Константин Кинчев. Группа стала одной из легенд ленинградского рока и выпустила несколько знаковых альбомов, включая "Не бойся" (1987) и "Этология" (1989).</p>
					</noscript>
				</article>
				<article class="text-block text-block-right" id="text-block-right" aria-label="Motivation">
					<noscript>
						<p class="text"><a href="https://ru.wikipedia.org/wiki/Задерий,_Святослав_Геннадьевич" target="_blank" style="color: #FCFCFC;">Святослав Задерий</a> стоял у истоков русского рока. Он основал группы <a href="https://ru.wikipedia.org/wiki/Алиса_(группа)" target="_blank" style="color: #FCFCFC;">"АЛИСА"</a> и <a href="https://ru.wikipedia.org/wiki/Нате!_(группа)" target="_blank" style="color: #FCFCFC;">"НАТЕ!"</a>. Его песни гремели по всему Союзу в конце 80-х и начале 90-х годов, а его неуёмная энергия вдохновляла соратников и поклонников на собственные свершения.</p>
						<p class="text">В 2023 году был выпущен концептуальный альбом <a href="about.html" style="color: #FCFCFC;">"Музыка для взрослых"</a>, записанный с участием более 50 музыкантов из различных известных рок-групп, включая участников Алисы, Аквариума, Кино, ДДТ и других. Альбом стал памятником Святославу Задерию и его вкладу в русский рок.</p>
					</noscript>
				</article>
